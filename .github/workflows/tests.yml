name: Cross-platform tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PORTAL_SCHEDULER_ENABLED: 'false'
      OPENAI_BATCH_SUBMISSION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - uses: r-lib/actions/setup-tinytex@v2
      - run: tlmgr update --self
      - run: tlmgr install collection-latexrecommended collection-fontsrecommended titlesec marvosym enumitem
      - run: python -m unittest discover -s tests
      - name: Parse Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'windows.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - name: Windows service lifecycle
        if: runner.os == 'Windows'
        run: |
          python -m venv --system-site-packages .venv
          python automation/windows_smoke.py
